name: Update library index

# Runs when .ic files are added, changed or removed, and rebuilds libraries/index.json.
# GitHub Pages cannot list a folder, so the web app reads this index to find the IC files.
on:
  push:
    paths:
      - "libraries/**.ic"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libraries/index.json
        run: |
          python3 - <<'PY'
          import glob, json, os
          names = sorted(os.path.basename(f) for f in glob.glob('libraries/*.ic'))
          with open('libraries/index.json', 'w', encoding='utf-8') as f:
              json.dump(names, f, indent=2)
              f.write('\n')
          print(names)
          PY

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update library index"
          file_pattern: libraries/index.json
