name: Update library index

# Rebuilds libraries/index.json whenever a .ic file in libraries/ is added, changed or removed.
# You can also run it by hand: Actions tab -> Update library index -> Run workflow.
on:
  push:
    paths:
      - "libraries/*.ic"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libraries/index.json
        run: |
          python3 - <<'PY'
          import glob, json, os
          names = sorted(os.path.basename(f) for f in glob.glob('libraries/*.ic'))
          with open('libraries/index.json', 'w', encoding='utf-8') as f:
              json.dump(names, f, indent=2)
              f.write('\n')
          print('Found', len(names), 'IC files:', names)
          PY

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update library index"
          file_pattern: libraries/index.json
